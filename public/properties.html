<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Home - HomeBridge</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #ffffff; padding: 16px 32px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 22px; font-weight: 700; color: #0284c7; text-decoration: none; }
    .logo span { color: #0f172a; }
    
    .container { max-width: 1100px; width: 90%; margin: 30px auto; flex: 1; }
    
    /* Search Bar Section */
    .filter-card { background: #ffffff; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 30px; }
    .filter-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
    .form-group { display: flex; flex-direction: column; }
    label { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    input, select { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; background: #fff; }
    input:focus, select:focus { border-color: #0284c7; }
    .btn-search { background: #0284c7; color: #ffffff; border: none; padding: 10px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .btn-search:hover { background: #0369a1; }
    
    /* Grid Layout */
    .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  </style>
</head>
<body>
  <header>
    <a href="/index.html" class="logo">Home<span>Bridge</span></a>
    <div class="nav-buttons">
      <a href="/login.html" style="color: #0284c7; text-decoration: none; font-weight: 600; margin-right: 12px;">Log in</a>
      <a href="/register.html" style="background: #0284c7; color: #fff; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600;">Get Started</a>
    </div>
  </header>

  <main class="container">
    <h2 style="margin-bottom: 16px; color: #0f172a;">Available Properties</h2>

    <!-- Search & Filter Controls -->
    <div class="filter-card">
      <form id="filterForm" class="filter-form">
        <div class="form-group">
          <label for="area">Area / Neighborhood</label>
          <input type="text" id="area" placeholder="e.g. Tanke, GRA">
        </div>
        <div class="form-group">
          <label for="propertyType">Property Type</label>
          <select id="propertyType">
            <option value="">All Types</option>
            <option value="Apartment">Apartment</option>
            <option value="Duplex">Duplex</option>
            <option value="Self Contain">Self Contain</option>
            <option value="Single Room">Single Room</option>
          </select>
        </div>
        <div class="form-group">
          <label for="maxPrice">Max Price (₦)</label>
          <input type="number" id="maxPrice" placeholder="e.g. 500000">
        </div>
        <button type="submit" class="btn-search">Filter Results</button>
      </form>
    </div>

    <!-- Live Property Grid -->
    <div class="property-grid" id="propertyGrid">
      <p style="text-align: center; grid-column: 1/-1; color: #64748b;">Loading available homes...</p>
    </div>
  </main>

  <script src="/js/auth.js"></script>
  <script src="/js/fetchProperties.js"></script>
  <script>
    // Handle Live Dynamic Filtering
    const filterForm = document.getElementById('filterForm');
    if (filterForm) {
      filterForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const area = document.getElementById('area').value;
        const propertyType = document.getElementById('propertyType').value;
        const maxPrice = document.getElementById('maxPrice').value;

        let queryString = '/api/properties?status=available';
        if (area) queryString += `&area=${encodeURIComponent(area)}`;
        if (propertyType) queryString += `&propertyType=${encodeURIComponent(propertyType)}`;
        if (maxPrice) queryString += `&maxPrice=${maxPrice}`;

        loadFilteredProperties(queryString);
      });
    }

    async function loadFilteredProperties(url) {
      const propertyGrid = document.getElementById('propertyGrid');
      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.success || data.data.length === 0) {
          propertyGrid.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: #64748b;">No matching homes found.</p>`;
          return;
        }

        propertyGrid.innerHTML = data.data.map((item) => {
          const coverImage = item.images && item.images.length > 0 ? item.images[0] : '/images/default-house.jpg';
          const ownerPhone = item.owner ? item.owner.phone : '';

          return `
            <div style="border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #fff;">
              <div style="position: relative; height: 180px;">
                <img src="${coverImage}" alt="${item.title}" style="width: 100%; height: 100%; object-fit: cover;">
                <span style="position: absolute; top: 10px; right: 10px; background: #0284c7; color: #fff; padding: 4px 8px; font-size: 11px; border-radius: 4px; text-transform: uppercase; font-weight: 600;">${item.propertyType}</span>
              </div>
              <div style="padding: 16px;">
                <h3 style="margin: 0 0 6px 0; font-size: 17px; color: #0f172a;">${item.title}</h3>
                <p style="color: #64748b; font-size: 13px; margin-bottom: 12px;">📍 ${item.location.area}, ${item.location.city}</p>
                <div style="margin-bottom: 12px;">
                  <span style="font-size: 18px; font-weight: bold; color: #0284c7;">₦${item.price.toLocaleString()} <small style="font-size: 12px; font-weight: normal; color: #64748b;">/${item.pricePeriod}</small></span>
                </div>
                <a href="https://wa.me/234${ownerPhone.replace(/^0/, '')}?text=Hello,%20I%20am%20interested%20in%20your%20property:%20${encodeURIComponent(item.title)}" target="_blank" style="display: block; text-align: center; background: #22c55e; color: #fff; padding: 9px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;">WhatsApp Landlord</a>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
