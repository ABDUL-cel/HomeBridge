<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeBridge | Landlord Dashboard</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Paystack Inline JS SDK -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Gradient Glow Backgrounds */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(37, 99, 235, 0.2);
            filter: blur(120px);
            border-radius: 50%;
            top: 5%;
            left: 10%;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(16, 185, 129, 0.15);
            filter: blur(120px);
            border-radius: 50%;
            bottom: 10%;
            right: 10%;
            z-index: 0;
        }

        /* Navbar Header */
        header {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .brand-logo span {
            color: #2563eb;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .user-profile-badge i {
            color: #10b981;
        }

        .btn-logout {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.55rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            max-width: 1100px;
            width: 92%;
            margin: 2.5rem auto;
            flex: 1;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-bar h2 {
            font-size: 1.6rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-add {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 0.75rem 1.4rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.92rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -5px rgba(37, 99, 235, 0.5);
        }

        /* Table Card */
        .table-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        td {
            padding: 1.1rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.93rem;
            color: #cbd5e1;
            vertical-align: middle;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Clickable Property Title */
        .property-title-link {
            font-weight: 600;
            color: #38bdf8;
            text-decoration: none;
            transition: color 0.2s ease, text-decoration 0.2s ease;
        }

        .property-title-link:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        .badge-available {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.3rem 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .badge-rented {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.3rem 0.75rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .btn-promote {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border: none;
            color: #ffffff;
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-promote:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.4);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82rem;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: #ef4444;
            color: #ffffff;
        }

        /* Toast Alert */
        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #10b981;
            color: #ffffff;
            padding: 0.8rem 1.4rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            z-index: 100;
        }
    </style>
</head>

<body>

    <header>
        <a href="/index.html" class="brand-logo">
            <i class="fa-solid fa-house-chimney-window" style="color: #2563eb;"></i>
            Home<span>Bridge</span>
        </a>
        <div class="user-nav">
            <div class="user-profile-badge">
                <i class="fa-solid fa-circle-user"></i>
                <span id="userNameDisplay">Landlord</span>
            </div>
            <button onclick="handleLogout()" class="btn-logout">
                <i class="fa-solid fa-right-from-bracket"></i> Logout
            </button>
        </div>
    </header>

    <main class="container">
        <div class="header-bar">
            <h2><i class="fa-solid fa-building-user" style="color: #2563eb;"></i> My Property Listings</h2>
            <a href="add-property.html" class="btn-add">
                <i class="fa-solid fa-plus"></i> Add New Listing
            </a>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>Property Title</th>
                        <th>Type</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="myPropertiesTable">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #94a3b8; padding: 2.5rem;">
                            <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 0.5rem; display: block;"></i>
                            Loading your listings...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div id="toast"></div>

    <script>
        const API_BASE_URL = 'https://homebridge-cu1l.onrender.com/api';

        // Helper function to get token safely from localStorage
        function getToken() {
            return localStorage.getItem('userToken');
        }

        // Show feedback message
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.style.background = isError ? '#ef4444' : '#10b981';
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // Handle Logout
        function handleLogout() {
            localStorage.removeItem('userToken');
            localStorage.removeItem('userRole');
            localStorage.removeItem('userName');
            window.location.href = '/auth.html';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const token = getToken();
            const storedName = localStorage.getItem('userName');

            if (storedName) {
                document.getElementById('userNameDisplay').textContent = storedName;
            }

            if (!token) {
                window.location.href = '/auth.html';
                return;
            }

            await loadProperties();
        });

        // Fetch & Render Properties
        async function loadProperties() {
            const token = getToken();
            const tableBody = document.getElementById('myPropertiesTable');

            try {
                const res = await fetch(`${API_BASE_URL}/properties/my-listings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();

                if (!res.ok || !data.data || data.data.length === 0) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align: center; color: #94a3b8; padding: 2.5rem;">
                                <i class="fa-regular fa-folder-open" style="font-size: 2rem; margin-bottom: 0.5rem; display: block;"></i>
                                You haven't listed any properties yet.
                            </td>
                        </tr>`;
                    return;
                }

                tableBody.innerHTML = data.data.map(item => `
                    <tr>
                        <td>
                            <a href="property-details.html?id=${item._id}" class="property-title-link" title="Click to view details">
                                ${item.title} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.75rem; margin-left: 0.2rem;"></i>
                            </a>
                        </td>
                        <td>${item.propertyType || 'Apartment'}</td>
                        <td style="color: #38bdf8; font-weight: 600;">₦${Number(item.price).toLocaleString()}</td>
                        <td>
                            <span class="${item.status === 'available' ? 'badge-available' : 'badge-rented'}">
                                <i class="fa-solid ${item.status === 'available' ? 'fa-circle-check' : 'fa-circle-xmark'}"></i>
                                ${item.status ? item.status.toUpperCase() : 'AVAILABLE'}
                            </span>
                        </td>
                        <td>
                            <div class="action-group">
                                <button onclick="payToPromote(5000, '${item._id}')" class="btn-promote" title="Promote Property Listing">
                                    <i class="fa-solid fa-rectangle-ad"></i> Promote (₦5,000)
                                </button>
                                <button onclick="toggleStatus('${item._id}', '${item.status}')" class="btn-action">
                                    <i class="fa-solid fa-arrows-rotate"></i>
                                    Mark ${item.status === 'available' ? 'Rented' : 'Available'}
                                </button>
                                <button onclick="deleteProperty('${item._id}')" class="btn-delete" title="Delete Property">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: #ef4444; padding: 2rem;">
                            Failed to connect to backend server.
                        </td>
                    </tr>`;
            }
        }

        // Toggle Status (Available <-> Rented)
        async function toggleStatus(id, currentStatus) {
            const token = getToken();
            const newStatus = currentStatus === 'available' ? 'rented' : 'available';

            try {
                const res = await fetch(`${API_BASE_URL}/properties/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: newStatus })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    showToast(`Property marked as ${newStatus}!`);
                    loadProperties();
                } else {
                    showToast(data.message || 'Failed to update status', true);
                }
            } catch (err) {
                showToast('Failed to connect to server', true);
            }
        }

        // Delete Property
        async function deleteProperty(id) {
            if (!confirm('Are you sure you want to delete this property listing?')) return;

            const token = getToken();
            try {
                const res = await fetch(`${API_BASE_URL}/properties/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    showToast('Property listing deleted!');
                    loadProperties();
                } else {
                    showToast(data.message || 'Failed to delete property', true);
                }
            } catch (err) {
                showToast('Failed to connect to server', true);
            }
        }

        // Paystack Payment Function
        function payToPromote(amount, propertyId) {
            const token = getToken();
            if (!token) {
                showToast('Please log in to promote a listing.', true);
                return;
            }

            const userEmail = localStorage.getItem('userEmail') || 'khalidabdulazeez19@gmail.com';

            const handler = PaystackPop.setup({
                key: 'pk_test_95e98d452733f190c4211604c4fb1bc96b412ff1',
                email: userEmail,
                amount: amount * 100, // Amount in kobo
                currency: 'NGN',
                metadata: {
                    propertyId: propertyId
                },
                onClose: function () {
                    showToast('Payment window closed.', true);
                },
                callback: function (response) {
                    showToast('Payment successful! Verifying with server...');
                    verifyPaymentOnServer(response.reference, propertyId);
                }
            });

            handler.openIframe();
        }

        // Verify Payment with Backend Server
        async function verifyPaymentOnServer(reference, propertyId) {
            const token = getToken();
            try {
                const res = await fetch(`${API_BASE_URL}/payments/verify/${reference}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    showToast('Promotion active! Property is now promoted.');
                    loadProperties();
                } else {
                    showToast(data.message || 'Payment verification failed', true);
                }
            } catch (err) {
                showToast('Failed to verify payment with server', true);
            }
        }
    </script>
</body>

</html>
