<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeBridge | Log In</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="auth-container">
        <div class="auth-card">

            <a href="index.html" class="logo">
                Home<span>Bridge</span>
            </a>

            <h2>Welcome Back</h2>
            <p>Log in to access your HomeBridge account.</p>

            <form id="loginForm">

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="primary-btn auth-btn">Log In</button>

            </form>

            <p class="auth-switch">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>

            <p id="responseMessage" class="response-message"></p>

        </div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const messageBox = document.getElementById('responseMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            messageBox.textContent = 'Logging in...';
            messageBox.style.color = '#555';

            try {
                const response = await fetch('https://homebridge-cu1l.onrender.com/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageBox.style.color = 'green';
                    messageBox.textContent = 'Login successful! Redirecting...';

                    if (data.token) {
                        localStorage.setItem('userToken', data.token);
                    }

                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    messageBox.style.color = 'red';
                    messageBox.textContent = data.message || 'Invalid email or password.';
                }
            } catch (error) {
                console.error('Error:', error);
                messageBox.style.color = 'red';
                messageBox.textContent = 'Unable to connect to server. Please try again later.';
            }
        });
    </script>

</body>

</html>
